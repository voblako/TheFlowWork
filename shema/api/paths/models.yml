# Учет  моделей
get:
  summary: Получить список моделей
  tags:
    - Model

  parameters:
    - name: name
      in: query
      schema:
        type: string
  responses:
    "200":
      description: Список моделей
      content:
        application/json:
          schema:
            type: array
            item:
              $ref: "../shemas/models.yml#/Model"

    "404":
      description: Модель(и) не найдена(ы)


put:
  summary:  Вставить информацию о модели
  tags:
    - Model

  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../shemas/models.yml#/Model"

  responses:
    "200":
      description: Модель обновлена
    "500":
      description: Внутренняя ошибка сервера


delete:
  summary: Удалить модель
  tags:
    - Model

  parameters:
    - name: id
      in: query
      required: true
      schema:
        type: integer

  responses:
    "204":
      description: Модель удалена

    "404":
      description: Модель не найдена