get:
  summary: Расписание смен
  tags: [Schedules]
  parameters:
    - in: query
      name: user_id
      schema:
        type: integer
      description: ID пользователя для фильтрации расписания по исполнителю
    - in: query
      name: start_time
      schema:
        type: string
        format: date-time
      description: Начало временного диапазона для фильтрации расписания
    - in: query
      name: end_time
      schema:
        type: string
        format: date-time
      description: Конец временного диапазона для фильтрации расписания
  responses:
    "200":
      description: расписание смен
      content:
        application/json:
          schema:
            type: array
            items: { $ref: "../shemas/schedules.yml#/Schedule" }

put:
  summary: Создать смену
  tags: [Schedules]
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: "../shemas/schedules.yml#/Schedule" }
  responses:
    "200":
      description: смена добавлена
      content:
        application/json: { $ref: "../shemas/schedules.yml#/Schedule" }

delete:
  summary: Удалить смену
  tags: [Schedules]
  responses:
    "204":
      description: смена удалена
    "404":
      description: смена не найдена
